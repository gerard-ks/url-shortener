#  URL Shortener - English Messages

#  Bean Validation (JSR-380)
VALIDATION_ERROR=Validation failed
MALFORMED_REQUEST=The request body is malformed or unreadable
MISSING_PARAMETER=Required parameter ''{0}'' is missing
TYPE_MISMATCH=Parameter ''{0}'' has an invalid type. Expected: {1}

#  URL Validation (RG-VAL-01 to RG-VAL-04)

URL_EMPTY=URL cannot be null or empty
URL_TOO_LONG=URL exceeds maximum length of {0} characters
URL_INVALID_PROTOCOL=URL must start with http:// or https://
URL_SELF_REFERENCE=Cannot shorten a URL pointing to this service
URL_INVALID_FORMAT=URL has an invalid format

#  Short Code Validation

SHORT_CODE_EMPTY=Short code cannot be null or empty
SHORT_CODE_TOO_SHORT=Short code must be at least {0} characters
SHORT_CODE_TOO_LONG=Short code cannot exceed {0} characters
SHORT_CODE_INVALID_CHARACTERS=Short code can only contain a-z, A-Z, 0-9, - and _
SHORT_CODE_RESERVED=Short code ''{0}'' is reserved by the system
SHORT_CODE_ALREADY_EXISTS=Short code ''{0}'' is already taken

#  Token Validation

TOKEN_EMPTY=Token cannot be null or empty
TOKEN_INVALID_FORMAT=Token has an invalid format
TOKEN_MISMATCH=Invalid token provided
TOKEN_MISSING=Authorization token is required

#  Expiration Validation

EXPIRATION_IN_PAST=Expiration date must be in the future
EXPIRATION_TOO_FAR=Expiration date cannot be more than {0} years in the future
EXPIRATION_INVALID_FORMAT=Invalid expiration date format

#  Resource State

URL_NOT_FOUND=No URL found for short code ''{0}''
URL_EXPIRED=URL ''{0}'' has expired

#  Business Rules

CANNOT_MODIFY_EXPIRED_URL=Cannot modify expired URL ''{0}''
CANNOT_ACCESS_EXPIRED_URL=Cannot access expired URL ''{0}''
NO_FIELD_TO_UPDATE=At least one field (url or expiresAt) must be provided for update

#  Security

ACCESS_DENIED=Access denied
IP_BLOCKED=IP address temporarily blocked. Retry after {0} seconds

#  Rate Limiting

RATE_LIMIT_EXCEEDED=Too many requests. Please retry after {0} seconds

#  System Errors

INTERNAL_ERROR=An unexpected error occurred. Please contact support.
CODE_GENERATION_FAILED=Failed to generate unique code after {0} attempts